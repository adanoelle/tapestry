[package]
name = "rfd"
version = "0.3.0"
edition = "2021"
authors = ["adanoelle <ada@tapestrylabs.org>"]
description = "CLI tool for managing RFD (Request for Discussion) documents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adanoelle/tapestry"
keywords = ["rfd", "documentation", "cli", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "cargo"] }

# Templating
minijinja = "2"

# Front matter parsing
gray_matter = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Date/time handling
chrono = { version = "0.4.38", features = ["serde"] }

# Markdown parsing
pulldown-cmark = "0.11"

# Error handling
anyhow = "1"
thiserror = "1"

# Colors and terminal output
colored = "2"

# Configuration
toml = "0.5"
dirs = "5"
once_cell = "1.19"

[dev-dependencies]
# Testing utilities
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "rfd"
path = "src/main.rs"

# Note: Profile settings are managed at the workspace level in /Cargo.toml
# The workspace uses lto, codegen-units=1, and opt-level=3 for release builds.
