[package]
name = "rfd"
version = "0.1.0"
edition = "2021"
authors = ["Ada <ada@tapestry.dev>"]
description = "CLI tool for managing RFD (Request for Discussion) documents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/tapestry"
keywords = ["rfd", "documentation", "cli", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "cargo"] }

# Templating
minijinja = "2"

# Front matter parsing
gray_matter = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Date/time handling
chrono = { version = "0.4.38", features = ["serde"] }

# Markdown parsing
pulldown-cmark = "0.11"

# Error handling
anyhow = "1"
thiserror = "1"

# Colors and terminal output
colored = "2"

# Configuration
toml = "0.5"
dirs = "5"
once_cell = "1.19"

# GitHub integration (async)
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
# Testing utilities
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "rfd"
path = "src/main.rs"

# Optimization for release builds
#
# For junior developers: These settings optimize for binary size and startup time,
# which are critical for CLI tools. The trade-off is longer compilation time.
[profile.release]
# Link-time optimization: Optimizes across all crates, not just within each one
# This can reduce binary size by 10-30% and improve performance
lto = true

# Code generation units: Using 1 allows better optimization but slower compilation
# For release builds, we prioritize runtime performance over build time
codegen-units = 1

# Optimize for size while maintaining good performance
# "z" is more aggressive than "s" for size reduction
opt-level = "z"

# Strip debug symbols from the binary
# This significantly reduces binary size (often 50%+ reduction)
strip = true

# Panic behavior: "abort" is smaller and faster than unwinding
# CLI tools typically don't need unwinding, so this is a safe optimization
panic = "abort"
