name: Community Engagement

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome-contributor:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Welcome new issue creator
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is the user's first issue
            const issues = await github.rest.search.issuesAndPullRequests({
              q: `author:${context.payload.sender.login} type:issue repo:${context.repo.owner}/${context.repo.repo}`
            });
            
            if (issues.data.total_count === 1) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `👋 Welcome to Tapestry! Thank you for your first contribution.

This project focuses on development provenance and AI-assisted coding workflows. Please check out:
- [Project Vision](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/VISION.md)
- [Design Documentation](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/design/README.md)
- [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/design/meta/contributing.md) *(coming soon)*

We're excited to have you as part of the community! 🎉

If you're proposing a new feature, please consider creating a design document following our [design documentation guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/design/meta/design-documentation-guide.md).`
              });
            }

      - name: Welcome new PR creator
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is the user's first PR
            const prs = await github.rest.search.issuesAndPullRequests({
              q: `author:${context.payload.sender.login} type:pr repo:${context.repo.owner}/${context.repo.repo}`
            });
            
            if (prs.data.total_count === 1) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🎉 Thank you for your first pull request to Tapestry!

Your contribution helps advance our understanding of AI-assisted development workflows. Please ensure:
- [ ] Your PR includes appropriate tests
- [ ] Design documents are updated if needed
- [ ] The PR description clearly explains the changes

Our maintainers will review your PR soon. Thanks for contributing to development provenance research! 🧶`
              });
            }

      - name: Label issues automatically
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body.toLowerCase();
            
            const labels = [];
            
            // Auto-label based on content
            if (title.includes('[feature]') || body.includes('mcp server')) {
              labels.push('enhancement');
            }
            
            if (title.includes('[bug]')) {
              labels.push('bug');
            }
            
            if (title.includes('[design]') || body.includes('design document')) {
              labels.push('documentation', 'design');
            }
            
            if (body.includes('research') || body.includes('provenance')) {
              labels.push('research');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }
