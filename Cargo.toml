[workspace]
resolver = "2"
members = [
    "mcp/*",
    "cli/*",
]

# Shared workspace dependencies
[workspace.dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Git operations (for git-workflow tool)
git2 = "0.18"

# Testing dependencies
tempfile = "3.8"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.12"

# MCP SDK (when available)
# rmcp = "0.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
