name: Community Engagement

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome-contributor:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Welcome new issue creator
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is the user's first issue
            const issues = await github.rest.search.issuesAndPullRequests({
              q: `author:${context.payload.sender.login} type:issue repo:${context.repo.owner}/${context.repo.repo}`
            });
            
            if (issues.data.total_count === 1) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `👋 Welcome to Tapestry! Thank you for your first contribution.

This project builds MCP tools for AI-assisted development using a pragmatic, incremental approach. Please check out:
- [Project Vision](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/VISION.md)
- [AI Collaboration Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.claude/README.md)
- [Agent Workflow Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.claude/agents/WORKFLOW-GUIDE.md)
- [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/design/meta/CONTRIBUTING.md)

We're excited to have you as part of the community! 🎉

If you're proposing a new MCP tool, please:
1. Create an RFC following our [RFC template](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.claude/templates/rfc-template.md)
2. Use our `/create-mcp-tool` command for scaffolding
3. Follow our [agent-driven workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.claude/workflows/new-mcp-tool.md)`
              });
            }

      - name: Welcome new PR creator
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this is the user's first PR
            const prs = await github.rest.search.issuesAndPullRequests({
              q: `author:${context.payload.sender.login} type:pr repo:${context.repo.owner}/${context.repo.repo}`
            });
            
            if (prs.data.total_count === 1) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🎉 Thank you for your first pull request to Tapestry!

Your contribution helps build practical MCP tools for AI-assisted development. Please ensure:
- [ ] Your PR includes appropriate tests (in `tests/` directory, not inline)
- [ ] RFCs are created for new tools or major features
- [ ] The PR follows our hexagonal architecture pattern
- [ ] Agent review checklists have been considered

Our maintainers will review your PR soon. Thanks for contributing to development provenance research! 🧶`
              });
            }

      - name: Label issues automatically
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body.toLowerCase();
            
            const labels = [];
            
            // Auto-label based on content
            if (title.includes('[feature]') || body.includes('mcp tool')) {
              labels.push('enhancement');
            }
            
            if (title.includes('[bug]')) {
              labels.push('bug');
            }
            
            if (title.includes('[rfc]') || body.includes('rfc')) {
              labels.push('documentation', 'rfc');
            }
            
            if (title.includes('[agent]') || body.includes('agent')) {
              labels.push('ai-workflow');
            }
            
            if (body.includes('.claude') || body.includes('ai-assisted')) {
              labels.push('ai-native');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }
