name: Continuous Integration

on:
  push:
    branches: [ main, develop, 'feat/*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          
      - name: Run tests
        run: cargo test --all --verbose
        
      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Check for unsafe code
        run: |
          if grep -r "unsafe" src/ --include="*.rs"; then
            echo "⚠️ Warning: Unsafe code detected - ensure it's justified"
          fi
          
      - name: Check for unwrap/expect
        run: |
          if grep -r "unwrap()\|expect(" src/ --include="*.rs" | grep -v "#\[cfg(test)\]"; then
            echo "⚠️ Warning: unwrap/expect detected in non-test code"
          fi

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check documentation links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
          
      - name: Validate .claude documentation
        run: |
          echo "Checking .claude documentation..."
          if [ ! -f ".claude/README.md" ]; then
            echo "❌ Missing .claude/README.md"
            exit 1
          fi
          if [ ! -f "CLAUDE.md" ]; then
            echo "❌ Missing root CLAUDE.md"
            exit 1
          fi
          echo "✅ AI documentation present"
          
      - name: Validate design doc structure
        run: |
          # Check RFCs follow naming convention
          for rfc in docs/design/features/RFC-*.md; do
            if [ -f "$rfc" ]; then
              filename=$(basename "$rfc")
              if ! [[ "$filename" =~ ^RFC-[0-9]{3}-.*\.md$ ]]; then
                echo "❌ RFC doesn't follow naming pattern: $filename"
                exit 1
              fi
            fi
          done
          echo "✅ RFC naming validated"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run security audit
        run: cargo audit
        
      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "password\|secret\|token\|api_key" src/ --include="*.rs" | \
             grep -v "// \|///\|pub struct\|fn \|let \|const " | \
             grep -i "=.*\"" ; then
            echo "⚠️ Warning: Potential hardcoded secrets detected"
          fi
